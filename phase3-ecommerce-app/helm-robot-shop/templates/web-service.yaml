apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    service: web
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    service: web
  # ClusterIP: traffic enters through the ALB Ingress, so no extra cloud load balancer is created
  type: {{ .Values.web.serviceType | default "ClusterIP" }}
