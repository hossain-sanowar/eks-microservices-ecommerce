apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  labels:
    app.kubernetes.io/name: guestbook-ui
    app.kubernetes.io/part-of: gitops-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook-ui
        app.kubernetes.io/part-of: gitops-demo
    spec:
      containers:
        - name: guestbook-ui
          image: gcr.io/heptio-images/ks-guestbook-demo:0.2
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: guestbook-ui-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
