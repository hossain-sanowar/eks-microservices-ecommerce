# Runs the Argo CD API server without its own TLS (HTTP).
# Acceptable for a short-lived demo behind port-forward only;
# in production, keep TLS and expose Argo CD through an Ingress with a certificate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
